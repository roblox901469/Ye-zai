<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夜載 YeZai - 極速全網影音解析</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .logo-icon svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .version-badge {
            background-color: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.4);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        main {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin: auto 0;
        }

        h1 {
            font-size: 2.75rem;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 48px;
        }

        .search-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 8px;
            display: flex;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.25);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            flex: 1;
            padding: 0 16px;
            gap: 12px;
        }

        .input-wrapper svg {
            width: 20px;
            height: 20px;
            stroke: #64748b;
            fill: none;
            stroke-width: 2;
        }

        input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 1.05rem;
        }

        input[type="text"]::placeholder {
            color: #475569;
        }

        .btn-parse {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        .btn-parse:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-parse:disabled {
            background: #334155;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-parse svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
        }

        .status-msg {
            margin-top: 20px;
            font-size: 0.95rem;
            min-height: 24px;
        }
        .status-msg.info { color: #38bdf8; }
        .status-msg.success { color: #4ade80; }
        .status-msg.error { color: #f87171; }

        footer {
            color: #475569;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-5.4-5.4c0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/></svg>
            </div>
            <span class="brand-name">夜載</span>
            <span class="version-badge">v1.0 Pro</span>
        </div>
        <div class="status-indicator">
            <div class="dot"></div>
            <span>核心引擎監控中</span>
        </div>
    </header>

    <main>
        <h1>貼上網址，自動偵測影片與畫質</h1>
        <p class="subtitle">支援 YouTube, Bilibili, X (Twitter), TikTok 及網頁內部 HTML5</p>

        <div class="search-box">
            <div class="input-wrapper">
                <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." value="https://www.youtube.com/watch?v=kgVpkkDqMpk">
            </div>
            <button class="btn-parse" id="parseBtn" onclick="handleDownload()">
                <svg viewBox="0 0 24 24"><path d="M7.5 5.6L5 7l1.4-2.5L5 2l2.5 1.4L10 2 8.6 4.5 10 7 7.5 5.6zm12 9.8L17 14l1.4 2.5L17 19l2.5-1.4L22 19l-1.4-2.5L22 14l-2.5 1.4zM22 2l-2.5 1.4L17 2l1.4 2.5L17 7l2.5-1.4L22 7l-1.4-2.5L22 2zm-7.63 5.29c-.39-.39-1.02-.39-1.41 0L1.29 18.96c-.39.39-.39 1.02 0 1.41l2.34 2.34c.39.39 1.02.39 1.41 0L16.7 11.04c.39-.39.39-1.02 0-1.41l-2.33-2.34z"/></svg>
                <span>開始解析</span>
            </button>
        </div>

        <div id="statusMessage" class="status-msg"></div>
    </main>

    <footer>
        © 2026 夜載 YeZai. 僅供個人學習與測試使用。
    </footer>

    <script>
        const API_BASE_URL = "https://ye-zai.onrender.com";

        async function handleDownload() {
            const urlInput = document.getElementById("videoUrl").value.trim();
            const parseBtn = document.getElementById("parseBtn");

            if (!urlInput) {
                showStatus("請輸入有效的影片網址！", "error");
                return;
            }

            parseBtn.disabled = true;
            showStatus("正在連線伺服器解析與下載中，請稍候...", "info");

            try {
                const response = await fetch(`${API_BASE_URL}/api/analyze`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ url: urlInput })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || "伺服器處理失敗");
                }

                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = downloadUrl;

                const contentDisposition = response.headers.get("Content-Disposition");
                let filename = "yezai_download.mp4";
                if (contentDisposition && contentDisposition.includes("filename=")) {
                    filename = decodeURIComponent(contentDisposition.split("filename=")[1].replace(/"/g, ''));
                }

                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                showStatus("下載成功！", "success");
            } catch (error) {
                console.error("Download Error:", error);
                showStatus(`下載失敗: ${error.message}`, "error");
            } finally {
                parseBtn.disabled = false;
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById("statusMessage");
            statusDiv.textContent = message;
            statusDiv.className = `status-msg ${type}`;
        }
    </script>
</body>
</html>
